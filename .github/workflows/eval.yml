name: Eval (faithfulness gate)

# Runs the LLM-judge eval and FAILS if the full pipeline's faithfulness drops
# below the threshold. Manual + weekly (not on every push) to control API cost.
# Requires a repository secret: GROQ_API_KEY.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  eval:
    name: Faithfulness gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run eval and gate on faithfulness
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.1-8b-instant
        run: python -m eval.run_eval --variant full --delay 2 --check-faithfulness 7.0
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/eval/report.*
