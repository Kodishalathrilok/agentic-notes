name: Supabase keep-alive

# Free Supabase projects pause after about a week without activity, and a
# paused project's hostname stops resolving: every sign-in (Google and email)
# and every token check then fails. That happened in October 2026.
#
# Every 3 days this runs one real query through the REST API. Row-level
# security returns no rows to the anon key, but Postgres still executes the
# query, which is what counts as activity.
# Requires repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY (the same
# values as the frontend's VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY).
#
# A missing secret fails the run instead of skipping it: a keep-alive that
# quietly does nothing lets the project pause again. Failures open an issue,
# for the reason given in eval.yml.
# GitHub itself disables scheduled workflows after 60 days with no commits.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 */3 * *" # every 3rd day, 07:17 UTC

permissions:
  contents: read
  issues: write # so a failed ping can raise an issue

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Query the sessions table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error title=Keep-alive cannot run::Add SUPABASE_URL and SUPABASE_ANON_KEY under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            "${SUPABASE_URL%/}/rest/v1/sessions?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo
          echo "Supabase answered."

      - name: Report a failed ping as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The Supabase keep-alive ping failed.\n\n- Run: ${run}\n\nIf the project is already paused, restore it in the Supabase dashboard; sign-in is down until then. If the secrets are missing, add SUPABASE_URL and SUPABASE_ANON_KEY.`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "keep-alive",
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: "Supabase keep-alive is failing", labels: ["keep-alive"], body,
              });
            }
